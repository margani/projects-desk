name: Checks

# Pull requests only. Deploying is left to each installation (docs/SETUP.md),
# because it needs that installation's private settings.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # The same command Workers Builds runs before it deploys.
      - run: npm run ci
